<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
   
</head>
<body>

    
    <div class="stopwatch">
        <div class="screen" id="screen">
        
        <div class="timer-circle">
            <p>Stopwatch</p>
            <h1 id="timer">00:00:00</h1>
        </div>
        
        
        
        <div class="button">
            <button class="buttons" onclick="startTimer()"><span>Start</span></button>
            <button class="buttons" onclick="resetTimer()"><span>Reset</span></button>
            
            </div>

            <p class="status" id="status">Smart Watch</p>
            
        </div>
    </div>
    
    
    
    
    <script src="./watch.js"></script>
    
</body>
</html>
